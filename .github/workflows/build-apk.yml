name: Build Pool Trainer RU APK
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: publish-pool-trainer
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK for direct download
        run: cp app/build/outputs/apk/debug/app-debug.apk Pool-Trainer-RU.apk
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest Pool-Trainer-RU.apk --clobber
          else
            gh release create apk-latest Pool-Trainer-RU.apk --title "Pool Trainer RU — APK" --notes "Установочный APK для Android. Прямая загрузка без ZIP." --latest
          fi
